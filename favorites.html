<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Favorites - LineupValue</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            white-space: nowrap;
        }
        .header a {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 13px;
            white-space: nowrap;
        }
        .header a:hover {
            background: rgba(255,255,255,0.3);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333;
        }
        .empty-state p {
            font-size: 16px;
            margin-bottom: 24px;
        }
        .empty-state a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .empty-state a:hover {
            background: #5a6fd6;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        th:hover {
            background: #e9ecef;
        }
        th.sort-asc::after {
            content: " ↑";
            color: #667eea;
        }
        th.sort-desc::after {
            content: " ↓";
            color: #667eea;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .player-name {
            font-weight: 600;
            color: #333;
        }
        .player-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #28a745;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .player-number:hover {
            background: #218838;
        }
        .flag {
            height: 14px;
            width: auto;
            vertical-align: middle;
            border-radius: 1px;
        }
        .pos-gk { color: #28a745; font-weight: bold; }
        .pos-def { color: #17a2b8; font-weight: bold; }
        .pos-mid { color: #ffc107; font-weight: bold; }
        .pos-att { color: #dc3545; font-weight: bold; }
        .squad-role {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.4;
            display: inline-block;
            text-align: center;
        }
        .squad-role.key { background: #d4edda; color: #155724; }
        .squad-role.main { background: #d4edda; color: #155724; }
        .squad-role.important { background: #fff3cd; color: #856404; }
        .squad-role.reserve { background: #fff3cd; color: #856404; }
        .impact-high { color: #28a745; font-weight: bold; }
        .impact-med { color: #ffc107; font-weight: bold; }
        .impact-low { color: #6c757d; font-weight: bold; }
        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-remove:hover {
            background: #c82333;
        }
        #favorites-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 10000;
        }
        #favorites-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        #favorites-toast.success {
            background: #28a745;
        }
        #favorites-toast.error {
            background: #dc3545;
        }
    
        td:nth-child(1), td:nth-child(5), td:nth-child(6), td:nth-child(7),
        td:nth-child(8), td:nth-child(9), td:nth-child(10), td:nth-child(11),
        td:nth-child(12), td:nth-child(13), td:nth-child(14), td:nth-child(15),
        td:nth-child(16),
        th:nth-child(1), th:nth-child(5), th:nth-child(6), th:nth-child(7),
        th:nth-child(8), th:nth-child(9), th:nth-child(10), th:nth-child(11),
        th:nth-child(12), th:nth-child(13), th:nth-child(14), th:nth-child(15),
        th:nth-child(16) {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💎 My Favorites</h1>
        <a href="/lineup_ai/select">← Back to Teams</a>
    </div>
    
    <div class="container">
        <div id="empty-state" class="empty-state" style="display:none;">
            <h2>No favorite players yet</h2>
            <p>Click on player numbers in team view to add them to your favorites.</p>
            <a href="/lineup_ai/select">Browse Teams</a>
        </div>
        
        <div id="table-container" class="table-container" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th data-sort="number">№</th>
                        <th data-sort="club">Club</th>
                        <th data-sort="national">Nat</th>
                        <th data-sort="name">Player</th>
                        <th data-sort="age">Age</th>
                        <th data-sort="mv">MV</th>
                        <th data-sort="position">Pos</th>
                        <th data-sort="squad_role">Squad<br>Role</th>
                        <th data-sort="impact">IS</th>
                        <th data-sort="apps">Apps</th>
                        <th data-sort="minutes">Min</th>
                        <th data-sort="goals">G</th>
                        <th data-sort="assists">A</th>
                        <th data-sort="yellows">YC</th>
                        <th data-sort="reds">RC</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="favorites-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="favorites-toast"></div>

    <script>
        // User is set by server
        let CURRENT_USER = window.CURRENT_USER || "owner";
        let sortColumn = "club";
        let sortDirection = "asc";
        let allFavorites = [];
        
        function formatMV(value) {
            if (!value || value === "-" || value === "?") return "–";
            return value;
        }
        
        function parseMV(value) {
            if (!value || value === "–" || value === "?") return 0;
            const match = String(value).match(/€?([\d.]+)([mk]?)/i);
            if (!match) return 0;
            const num = parseFloat(match[1]);
            const mult = match[2].toLowerCase();
            if (mult === 'm') return num * 1000000;
            if (mult === 'k') return num * 1000;
            return num;
        }
        
        function parseNumber(value) {
            if (!value || value === "–" || value === "?") return 0;
            const num = parseFloat(String(value).replace(/[^\d.]/g, ''));
            return isNaN(num) ? 0 : num;
        }
        
        function getFlagCode(national) {
            if (!national || national === "–") return null;
            const codes = {
                "Afghanistan": "af", "Albania": "al", "Algeria": "dz", "Andorra": "ad",
                "Angola": "ao", "Antigua and Barbuda": "ag", "Argentina": "ar", "Armenia": "am",
                "Australia": "au", "Austria": "at", "Azerbaijan": "az", "Bahamas": "bs",
                "Bahrain": "bh", "Bangladesh": "bd", "Barbados": "bb", "Belarus": "by",
                "Belgium": "be", "Belize": "bz", "Benin": "bj", "Bhutan": "bt",
                "Bolivia": "bo", "Bosnia and Herzegovina": "ba", "Bosnia": "ba",
                "Botswana": "bw", "Brazil": "br", "Brunei": "bn", "Bulgaria": "bg",
                "Burkina Faso": "bf", "Burundi": "bi", "Cambodia": "kh", "Cameroon": "cm",
                "Canada": "ca", "Cape Verde": "cv", "Cabo Verde": "cv",
                "Central African Republic": "cf", "Chad": "td", "Chile": "cl", "China": "cn",
                "Colombia": "co", "Comoros": "km", "Congo": "cg", "Republic of the Congo": "cg",
                "DR Congo": "cd", "Congo DR": "cd", "Democratic Republic of the Congo": "cd",
                "Costa Rica": "cr", "Croatia": "hr", "Cuba": "cu", "Curaçao": "cw", "Cyprus": "cy",
                "Czech Republic": "cz", "Czechia": "cz", "Denmark": "dk", "Djibouti": "dj",
                "Dominica": "dm", "Dominican Republic": "do", "Ecuador": "ec", "Egypt": "eg",
                "El Salvador": "sv", "Equatorial Guinea": "gq", "Eritrea": "er", "Estonia": "ee",
                "Eswatini": "sz", "Swaziland": "sz", "Ethiopia": "et", "Fiji": "fj",
                "Faroe Islands": "fo", "Finland": "fi", "France": "fr", "French Guiana": "gf",
                "French Polynesia": "pf", "Gabon": "ga", "Gambia": "gm", "Guadeloupe": "gp",
                "Guam": "gu", "Georgia": "ge", "Germany": "de", "Ghana": "gh", "Greece": "gr",
                "Grenada": "gd", "Guatemala": "gt", "Guinea": "gn", "Guinea-Bissau": "gw",
                "Guyana": "gy", "Haiti": "ht", "Honduras": "hn", "Hungary": "hu",
                "Iceland": "is", "India": "in", "Indonesia": "id", "Iran": "ir",
                "Iraq": "iq", "Ireland": "ie", "Israel": "il", "Italy": "it",
                "Ivory Coast": "ci", "Côte d'Ivoire": "ci", "Jamaica": "jm", "Japan": "jp",
                "Jordan": "jo", "Kazakhstan": "kz", "Kenya": "ke", "Kiribati": "ki",
                "Kosovo": "xk", "Kuwait": "kw", "Kyrgyzstan": "kg", "Laos": "la",
                "Latvia": "lv", "Lebanon": "lb", "Lesotho": "ls", "Liberia": "lr",
                "Libya": "ly", "Liechtenstein": "li", "Lithuania": "lt", "Luxembourg": "lu",
                "Madagascar": "mg", "Malawi": "mw", "Malaysia": "my", "Maldives": "mv",
                "Mali": "ml", "Malta": "mt", "Marshall Islands": "mh", "Mauritania": "mr",
                "Mauritius": "mu", "Mexico": "mx", "Micronesia": "fm", "Moldova": "md",
                "Monaco": "mc", "Mongolia": "mn", "Montenegro": "me", "Morocco": "ma",
                "Mozambique": "mz", "Myanmar": "mm", "Namibia": "na", "Nauru": "nr",
                "Nepal": "np", "Netherlands": "nl", "New Zealand": "nz", "Nicaragua": "ni",
                "Niger": "ne", "Nigeria": "ng", "North Korea": "kp", "North Macedonia": "mk",
                "Norway": "no", "Oman": "om", "Pakistan": "pk", "Palau": "pw",
                "Palestine": "ps", "Panama": "pa", "Papua New Guinea": "pg", "Paraguay": "py",
                "Peru": "pe", "Philippines": "ph", "Poland": "pl", "Portugal": "pt",
                "Qatar": "qa", "Romania": "ro", "Russia": "ru", "Rwanda": "rw",
                "Saint Kitts and Nevis": "kn", "Saint Lucia": "lc",
                "Saint Vincent and the Grenadines": "vc", "Samoa": "ws", "San Marino": "sm",
                "Sao Tome and Principe": "st", "Saudi Arabia": "sa", "Senegal": "sn",
                "Serbia": "rs", "Seychelles": "sc", "Sierra Leone": "sl", "Singapore": "sg",
                "Slovakia": "sk", "Slovenia": "si", "Solomon Islands": "sb", "Somalia": "so",
                "South Africa": "za", "South Korea": "kr", "South Sudan": "ss", "Spain": "es",
                "Sri Lanka": "lk", "Sudan": "sd", "Suriname": "sr", "Sweden": "se",
                "Switzerland": "ch", "Syria": "sy", "Taiwan": "tw", "Tajikistan": "tj",
                "Tanzania": "tz", "Thailand": "th", "Togo": "tg", "Tonga": "to",
                "Trinidad and Tobago": "tt", "Tunisia": "tn", "Turkey": "tr",
                "Turkmenistan": "tm", "Tuvalu": "tv", "Uganda": "ug", "Ukraine": "ua",
                "United Arab Emirates": "ae", "United Kingdom": "gb", "England": "gb",
                "Scotland": "gb-sct", "Wales": "gb-wls", "Northern Ireland": "gb-nir",
                "USA": "us", "United States": "us", "Uruguay": "uy", "Uzbekistan": "uz",
                "Vanuatu": "vu", "Vatican City": "va", "Venezuela": "ve", "Vietnam": "vn",
                "Yemen": "ye", "Zambia": "zm", "Zimbabwe": "zw"
            };
            let code = codes[national.trim()];
            if (!code) {
                for (const [cn, cd] of Object.entries(codes)) {
                    if (cn.toLowerCase() === national.trim().toLowerCase()) { code = cd; break; }
                }
            }
            return code || null;
        }
        
        async function loadFavorites() {
            try {
                const res = await fetch("/api/favorites");
                const data = await res.json();
                return data.favorites || [];
            } catch (e) {
                console.error("Failed to load favorites:", e);
                return [];
            }
        }
        
        async function saveFavorites(favorites) {
            // Note: This is now handled via individual add/remove API calls
            // This function kept for compatibility
        }
        
        async function removeFavorite(playerId, playerName) {
            try {
                await fetch(`/api/favorites/${encodeURIComponent(playerId)}`, { method: "DELETE" });
                showToast(`Removed ${playerName || "player"} from favorites`);
                renderFavorites();
            } catch (e) {
                showToast("Failed to remove favorite", "error");
            }
        }
        
        function showToast(message, type = "success") {
            const toast = document.getElementById("favorites-toast");
            toast.textContent = message;
            toast.className = "show " + type;
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }
        
        function sortFavorites(favorites, column, direction) {
            const sorted = [...favorites];
            
            sorted.sort((a, b) => {
                let valA, valB;
                
                switch (column) {
                    case 'number':
                        valA = parseNumber(a.number);
                        valB = parseNumber(b.number);
                        break;
                    case 'age':
                        valA = parseNumber(a.age);
                        valB = parseNumber(b.age);
                        break;
                    case 'mv':
                        valA = parseMV(a.mv);
                        valB = parseMV(b.mv);
                        break;
                    case 'impact':
                        valA = parseNumber(a.impact);
                        valB = parseNumber(b.impact);
                        break;
                    case 'apps':
                        valA = parseNumber(a.apps);
                        valB = parseNumber(b.apps);
                        break;
                    case 'minutes':
                        valA = parseNumber(a.minutes);
                        valB = parseNumber(b.minutes);
                        break;
                    case 'goals':
                        valA = parseNumber(a.goals);
                        valB = parseNumber(b.goals);
                        break;
                    case 'assists':
                        valA = parseNumber(a.assists);
                        valB = parseNumber(b.assists);
                        break;
                    case 'yellows':
                        valA = parseNumber(a.yellows);
                        valB = parseNumber(b.yellows);
                        break;
                    case 'reds':
                        valA = parseNumber(a.reds);
                        valB = parseNumber(b.reds);
                        break;
                    default:
                        valA = String(a[column] || '').toLowerCase();
                        valB = String(b[column] || '').toLowerCase();
                }
                
                if (typeof valA === 'number' && typeof valB === 'number') {
                    return direction === 'asc' ? valA - valB : valB - valA;
                } else {
                    if (valA < valB) return direction === 'asc' ? -1 : 1;
                    if (valA > valB) return direction === 'asc' ? 1 : -1;
                    return 0;
                }
            });
            
            return sorted;
        }
        
        function updateSortUI(column) {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === column) {
                    th.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }
        
        function renderTable(favorites) {
            const tbody = document.getElementById("favorites-tbody");
            tbody.innerHTML = favorites.map((p, idx) => {
                const flagCode = getFlagCode(p.national);
                const flagHtml = flagCode 
                    ? `<img src="https://flagcdn.com/w20/${flagCode}.png" alt="${p.national || ''}" class="flag">`
                    : "–";
                
                const squadRole = p.squad_role || "";
                const squadRoleParts = squadRole.split(" ");
                const squadRoleHtml = squadRole 
                    ? `<span class="squad-role ${squadRole.toLowerCase()}">${squadRoleParts[0]}<br>${squadRoleParts.slice(1).join(" ") || ""}</span>`
                    : "–";
                
                return `
                <tr data-idx="${idx}">
                    <td>
                        <span class="player-number" title="Click to remove from favorites" onclick="removeFavorite('${p.player_id}', '${p.name || ""}')">${p.number || "?"}</span>
                    </td>
                    <td>${p.club || "–"}</td>
                    <td>${flagHtml}</td>
                    <td><span class="player-name">${p.name || "–"}</span></td>
                    <td>${p.age || "–"}</td>
                    <td>${formatMV(p.mv)}</td>
                    <td class="pos-${(p.position || "").toLowerCase()}">${p.position || "–"}</td>
                    <td>${squadRoleHtml}</td>
                    <td class="impact-${(p.impact || "").toLowerCase()}">${p.impact || "–"}</td>
                    <td>${p.apps || "–"}</td>
                    <td>${p.minutes || "–"}</td>
                    <td>${p.goals || "–"}</td>
                    <td>${p.assists || "–"}</td>
                    <td>${p.yellows || "–"}</td>
                    <td>${p.reds || "–"}</td>
                    <td>
                        <button class="btn-remove" onclick="removeFavorite('${p.player_id}', '${p.name || ""}')">Remove</button>
                    </td>
                </tr>
            `}).join("");
        }
        
        async function renderFavorites() {
            allFavorites = await loadFavorites();
            const emptyState = document.getElementById("empty-state");
            const tableContainer = document.getElementById("table-container");
            
            if (allFavorites.length === 0) {
                emptyState.style.display = "block";
                tableContainer.style.display = "none";
                return;
            }
            
            emptyState.style.display = "none";
            tableContainer.style.display = "block";
            
            const sorted = sortFavorites(allFavorites, sortColumn, sortDirection);
            updateSortUI(sortColumn);
            renderTable(sorted);
        }
        
        // Sort click handlers
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const column = th.dataset.sort;
                    if (sortColumn === column) {
                        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortColumn = column;
                        sortDirection = 'asc';
                    }
                    const sorted = sortFavorites(allFavorites, sortColumn, sortDirection);
                    updateSortUI(sortColumn);
                    renderTable(sorted);
                });
            });
            
            renderFavorites();
        });
    </script>
</body>
</html>
