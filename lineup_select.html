<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>LineupValue - Select Team</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%), url("/static/lineup_bg.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .favorites-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
        }
        .favorites-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }
        h1 {
            color: #333;
            margin-top: 0;
            font-size: 28px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
        }
        select:hover {
            border-color: #667eea;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .spinner {
            display: none;
            text-align: center;
            padding: 30px;
        }
        .spinner.active {
            display: block;
        }
        .spinner-circle {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner-text {
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/lineup_ai/favorites" class="favorites-btn">
            <span>💎</span> My Favorites
        </a>
        <h1>📊 LineupValue</h1>
        <p style="text-align: center; color: #666; margin-bottom: 32px;">
            Select a team to view squad
        </p>
        
        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" onchange="onCountryChange()">
                <option value="">-- Select Country --</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="championship">Championship</label>
            <select id="championship" onchange="onChampionshipChange()" disabled>
                <option value="">-- Select Championship --</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="team">Team</label>
            <select id="team" onchange="onTeamChange()" disabled>
                <option value="">-- Select Team --</option>
            </select>
        </div>

        <div class="form-group" id="match-group" style="display:none;">
            <label for="match">Match</label>
            <select id="match" onchange="onMatchChange()">
                <option value="">-- Select a match --</option>
            </select>
        </div>

        <div id="match-actions" style="display:none; text-align: center; margin-top: 20px;">
            <button id="btn-team-analysis" onclick="openTeamAnalysis()" style="background: #667eea; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 0 8px;">
                Team Analysis
            </button>
        </div>

        <div id="spinner" class="spinner">
            <div class="spinner-circle"></div>
            <div class="spinner-text">Loading squad...</div>
        </div>
    </div>

    <script>
        let lineupData = null;
        
        async function loadLineupData() {
            try {
                const response = await fetch('/lineup_ai/data.json');
                lineupData = await response.json();
                populateCountries();
            } catch (error) {
                console.error('Error loading lineup data:', error);
                showError('Failed to load team data');
            }
        }
        
        function populateCountries() {
            const countrySelect = document.getElementById('country');
            const championships = Object.keys(lineupData).sort();
            
            championships.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });
        }
        
        function onCountryChange() {
            const country = document.getElementById('country').value;
            const championshipSelect = document.getElementById('championship');
            const teamSelect = document.getElementById('team');
            
            // Reset championships and teams
            championshipSelect.innerHTML = '<option value="">-- Select Championship --</option>';
            teamSelect.innerHTML = '<option value="">-- Select Team --</option>';
            teamSelect.disabled = true;
            
            if (!country || !lineupData[country]) {
                championshipSelect.disabled = true;
                return;
            }
            
            const championships = Object.keys(lineupData[country]).sort();
            championships.forEach(championship => {
                const option = document.createElement('option');
                option.value = championship;
                option.textContent = championship;
                championshipSelect.appendChild(option);
            });
            
            championshipSelect.disabled = false;
        }
        
        function onChampionshipChange() {
            const country = document.getElementById('country').value;
            const championship = document.getElementById('championship').value;
            const teamSelect = document.getElementById('team');
            
            // Reset teams
            teamSelect.innerHTML = '<option value="">-- Select Team --</option>';
            
            if (!country || !championship || !lineupData[country][championship]) {
                teamSelect.disabled = true;
                return;
            }
            
            const teams = lineupData[country][championship];
            teams.forEach(team => {
                const option = document.createElement('option');
                option.value = team.id;
                option.textContent = team.name;
                teamSelect.appendChild(option);
            });
            
            teamSelect.disabled = false;
        }
        
        let fixturesData = null;

        async function onTeamChange() {
            const teamSelect = document.getElementById('team');
            const teamId = teamSelect.value;
            const matchSelect = document.getElementById('match');
            const matchGroup = document.getElementById('match-group');
            const matchActions = document.getElementById('match-actions');
            
            if (!teamId) {
                matchGroup.style.display = 'none';
                matchActions.style.display = 'none';
                return;
            }

            // Show match dropdown and Team Analysis button
            matchGroup.style.display = 'block';
            matchActions.style.display = 'block';
            
            // Load fixtures
            document.getElementById('spinner').classList.add('active');
            matchSelect.innerHTML = '<option value="">Loading fixtures...</option>';
            matchSelect.disabled = true;
            
            try {
                const resp = await fetch('/lineup_ai/api/fixtures/' + teamId);
                const data = await resp.json();
                fixturesData = data.fixtures || [];
                
                matchSelect.innerHTML = '<option value="">-- Select a match --</option>';
                fixturesData.forEach((f, i) => {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = f.date + '  ' + f.home + ' - ' + f.away;
                    matchSelect.appendChild(opt);
                });
                matchSelect.disabled = false;
            } catch (e) {
                console.error('Failed to load fixtures:', e);
                matchSelect.innerHTML = '<option value="">Failed to load</option>';
            }
            document.getElementById('spinner').classList.remove('active');
        }

        function onMatchChange() {
            const teamId = document.getElementById('team').value;
            const idx = document.getElementById('match').value;
            if (!teamId || idx === '') return;
            
            const fixture = fixturesData[parseInt(idx)];
            if (fixture) {
                document.getElementById('spinner').classList.add('active');
                // Use IDs from fixtures API directly
                const homeId = fixture.home_id || '';
                const awayId = fixture.away_id || '';
                const homeNm = fixture.home || '';
                const awayNm = fixture.away || '';
                const params = new URLSearchParams({
                    mid: fixture.mid,
                    home_id: homeId,
                    away_id: awayId,
                    home_name: homeNm,
                    away_name: awayNm
                });
                window.location.href = '/lineup_ai/compare/' + teamId + '?' + params.toString();
            }
        }

        function openTeamAnalysis() {
            const teamId = document.getElementById('team').value;
            if (!teamId) return;
            document.getElementById('spinner').classList.add('active');
            window.location.href = '/lineup_ai/' + teamId;
        }
        
        function showError(message) {
            const container = document.querySelector('.container');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            container.appendChild(errorDiv);
        }
        
        // Ensure spinner is hidden on load and on bfcache restore
        document.getElementById('spinner').classList.remove('active');
        window.addEventListener('pageshow', function(e) {
            document.getElementById('spinner').classList.remove('active');
        });
        
        // Initialize
        loadLineupData();
    </script>
</body>
</html>
