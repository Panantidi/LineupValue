<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match: {{my_name}} vs {{opponent_name}}</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
}
.compare-header {
    position: relative;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 10px 20px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.compare-header h2 { font-size: 20px; margin: 0; }
.compare-header .stadium { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.compare-header .stadium.neutral { color: #ff9800; font-weight: 600; }
.compare-header-controls {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
}
.compare-header-controls a {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-size: 13px;
}
.compare-header-controls button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: background 0.2s;
}
.compare-wrapper {
    flex: 1 1 auto;
    display: flex;
    overflow-y: auto;
    overflow-x: hidden;
}
.compare-container {
    display: flex;
    flex: 1 0 auto;
    gap: 0;
    min-width: min-content;
    align-items: flex-start;
}
.team-frame {
    flex: 1 1 0;
    min-width: 0;
    width: 50%;
    border: none;
    display: block;
}
.team-divider {
    width: 2px;
    background: linear-gradient(180deg, #667eea, #764ba2);
    flex-shrink: 0;
    align-self: stretch;
}
</style>
</head>
<body>
<div class="compare-header">
    <h2>{{my_name}} vs {{opponent_name}}</h2>
    <div class="stadium {{stadium_class}}">{{stadium_text}}</div>
    <div class="compare-header-controls">
        <a href="/lineup_ai/select">&#8592; Back to teams</a>
        <button onclick="exportLeftScreenshot()" title="Save Screenshot">&#x1F4F8;</button>
    </div>
</div>
<div class="compare-wrapper" id="scroll-wrapper">
<div class="compare-container" id="frames-container">
    <iframe id="my-frame" class="team-frame" src="/lineup_ai/{{my_team_id}}?embed=1" title="{{my_name}}"></iframe>
    <div class="team-divider"></div>
    <iframe id="opp-frame" class="team-frame" src="/lineup_ai/{{opp_team_id}}?embed=1" title="{{opponent_name}}"></iframe>
</div>
</div>

<script>
(function() {
    var myFrame = document.getElementById('my-frame');
    var oppFrame = document.getElementById('opp-frame');
    var scrollWrapper = document.getElementById('scroll-wrapper');

    function hideHeaderElements(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            var links = doc.querySelectorAll('a[href="/lineup_ai/select"]');
            links.forEach(function(el) { el.style.display = 'none'; });
            var btn = doc.getElementById('btn-export');
            if (btn) {
                var parent = btn.closest('div[style*="position:relative"]') || btn.closest('div') || btn.parentElement;
                if (parent && parent !== doc.body) parent.style.display = 'none';
                else btn.style.display = 'none';
            }
            var all = doc.querySelectorAll("button, a, div, span, form, aside");
            all.forEach(function(el) {
                var txt = (el.textContent || '').trim();
                var cls = (el.className || '').toString();
                var id = (el.id || '').toString();
                var isLeaf = el.children.length === 0;
                if (el.tagName === 'BUTTON' && (txt.includes('Save') || txt.includes('Сохранить'))) {
                    el.style.display = 'none';
                }
                if (cls.includes('my-squads') || cls.includes('save-panel') || cls.includes('save-block') ||
                    id.includes('save') || id.includes('my-squads') || id.includes('squad-save')) {
                    el.style.display = 'none';
                }
                if (isLeaf && (txt === 'My Squads' || txt === 'Мои составы' || txt.includes('My Squads'))) {
                    el.style.display = 'none';
                }
            });
            var saveForms = doc.querySelectorAll('form[action*="save"]');
            var cacheBadge = doc.querySelector(".cache-badge"); if (cacheBadge) cacheBadge.style.display = "none";
            saveForms.forEach(function(f) { f.style.display = 'none'; });
        } catch(e) {}
    }

    function resizeFrame(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            var height = doc.documentElement.scrollHeight || doc.body.scrollHeight || 800;
            frame.style.height = height + 'px';
        } catch(e) {}
    }

    myFrame.onload = function() { 
        hideHeaderElements(myFrame); 
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
    };
    oppFrame.onload = function() { 
        hideHeaderElements(oppFrame); 
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
    };

    window.exportLeftScreenshot = function() {
        try {
            myFrame.contentWindow.exportScreenshot();
        } catch(e) {
            alert('Screenshot failed: ' + e.message);
        }
    };
})();
</script>
</body>
</html>
