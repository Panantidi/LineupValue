<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match: {{my_name}} vs {{opponent_name}}</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
}
.compare-header {
    position: relative;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 10px 20px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.compare-header h2 { font-size: 20px; margin: 0; }
.compare-header .stadium { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.compare-header .stadium.neutral { color: #ff9800; font-weight: 600; }
.compare-header-controls {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
}
.compare-header-controls a {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-size: 13px;
}
.compare-header-controls button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: background 0.2s;
}
.compare-wrapper {
    flex: 1 1 auto;
    display: flex;
    overflow-y: auto;
    overflow-x: hidden;
}
.compare-container {
    display: flex;
    flex: 1 0 auto;
    gap: 0;
    min-width: min-content;
    align-items: flex-start;
}
.team-frame {
    flex: 1 1 0;
    min-width: 0;
    width: 50%;
    border: none;
    display: block;
}
.team-divider {
    width: 2px;
    background: linear-gradient(180deg, #667eea, #764ba2);
    flex-shrink: 0;
    align-self: stretch;
}
</style>
</head>
<body>
<div class="compare-header">
    <h2>{{my_name}} vs {{opponent_name}}</h2>
    <div class="stadium {{stadium_class}}">{{stadium_text}}</div>
    <div class="compare-header-controls">
        <a href="/lineup_ai/select">&#8592; Back to teams</a>
        <button onclick="exportMatchScreenshot()" title="Save Screenshot">&#x1F4F8;</button>
    </div>
</div>
<div class="compare-wrapper" id="scroll-wrapper">
<div class="compare-container" id="frames-container">
    <iframe id="my-frame" class="team-frame" src="/lineup_ai/{{my_team_id}}?embed=1" title="{{my_name}}"></iframe>
    <iframe id="opp-frame" class="team-frame" src="/lineup_ai/{{opp_team_id}}?embed=1" title="{{opponent_name}}"></iframe>
</div>
</div>

<script>
(function() {
    var myFrame = document.getElementById('my-frame');
    var oppFrame = document.getElementById('opp-frame');
    var scrollWrapper = document.getElementById('scroll-wrapper');

    function hideHeaderElements(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            var links = doc.querySelectorAll('a[href="/lineup_ai/select"]');
            links.forEach(function(el) { el.style.display = 'none'; });
            var btn = doc.getElementById('btn-export');
            if (btn) {
                var parent = btn.closest('div[style*="position:relative"]') || btn.closest('div') || btn.parentElement;
                if (parent && parent !== doc.body) parent.style.display = 'none';
                else btn.style.display = 'none';
            }
            var all = doc.querySelectorAll("button, a, div, span, form, aside");
            all.forEach(function(el) {
                var txt = (el.textContent || '').trim();
                var cls = (el.className || '').toString();
                var id = (el.id || '').toString();
                var isLeaf = el.children.length === 0;
                if (el.tagName === 'BUTTON' && (txt.includes('Save') || txt.includes('Сохранить'))) {
                    el.style.display = 'none';
                }
                if (cls.includes('my-squads') || cls.includes('save-panel') || cls.includes('save-block') ||
                    id.includes('save') || id.includes('my-squads') || id.includes('squad-save')) {
                    el.style.display = 'none';
                }
                if (isLeaf && (txt === 'My Squads' || txt === 'Мои составы' || txt.includes('My Squads'))) {
                    el.style.display = 'none';
                }
            });
            var saveForms = doc.querySelectorAll('form[action*="save"]');
            var cacheBadge = doc.querySelector(".cache-badge"); if (cacheBadge) cacheBadge.style.display = "none";
            saveForms.forEach(function(f) { f.style.display = 'none'; });
        } catch(e) {}
    }

    function resizeFrame(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            var height = doc.documentElement.scrollHeight || doc.body.scrollHeight || 800;
            frame.style.height = height + 'px';
        } catch(e) {}
    }

    myFrame.onload = function() { 
        hideHeaderElements(myFrame); 
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
    };
    oppFrame.onload = function() { 
        hideHeaderElements(oppFrame); 
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
    };

    window.exportMatchScreenshot = function() {
        var btn = event.target.closest('button');
        if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; }
        try {
            captureBoth();
        } catch(e) {
            alert('Screenshot failed: ' + e.message);
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
        }
    };

    function captureBoth() {
        // Load html2canvas into the parent document
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = function() { doCapture(); };
        script.onerror = function() { alert('Failed to load html2canvas'); };
        document.head.appendChild(script);
    }

    function doCapture() {
        var myDoc = myFrame.contentDocument || myFrame.contentWindow.document;
        var oppDoc = oppFrame.contentDocument || oppFrame.contentWindow.document;

        var myName = (myDoc.querySelector('.header h1') || {}).textContent || 'Home';
        var oppName = (oppDoc.querySelector('.header h1') || {}).textContent || 'Away';

        var myInfoBar = myDoc.getElementById('info-bar-squad');
        var myCompTable = myDoc.getElementById('comparison-table');
        var myMainTable = myDoc.querySelector('.table-container');
        var oppInfoBar = oppDoc.getElementById('info-bar-squad');
        var oppCompTable = oppDoc.getElementById('comparison-table');
        var oppMainTable = oppDoc.querySelector('.table-container');

        // Build off-screen container
        var capture = document.createElement('div');
        capture.style.cssText = 'position:absolute;left:-9999px;top:0;background:#f4f6f9;padding:20px;display:flex;gap:20px;align-items:flex-start;width:auto;';

        // Build left column (my team)
        var leftCol = document.createElement('div');
        leftCol.style.cssText = 'flex:0 0 auto;';
        var leftHdr = document.createElement('div');
        leftHdr.style.cssText = 'font-size:22px;font-weight:700;color:#333;margin-bottom:12px;font-family:system-ui;';
        leftHdr.textContent = myName;
        leftCol.appendChild(leftHdr);
        if (myInfoBar) leftCol.appendChild(myInfoBar.cloneNode(true));
        if (myCompTable) leftCol.appendChild(myCompTable.cloneNode(true));
        if (myMainTable) leftCol.appendChild(myMainTable.cloneNode(true));

        // Build right column (opponent)
        var rightCol = document.createElement('div');
        rightCol.style.cssText = 'flex:0 0 auto;';
        var rightHdr = document.createElement('div');
        rightHdr.style.cssText = 'font-size:22px;font-weight:700;color:#333;margin-bottom:12px;font-family:system-ui;';
        rightHdr.textContent = oppName;
        rightCol.appendChild(rightHdr);
        if (oppInfoBar) rightCol.appendChild(oppInfoBar.cloneNode(true));
        if (oppCompTable) rightCol.appendChild(oppCompTable.cloneNode(true));
        if (oppMainTable) rightCol.appendChild(oppMainTable.cloneNode(true));

        capture.appendChild(leftCol);
        capture.appendChild(rightCol);
        document.body.appendChild(capture);

        // Replace checkboxes with circles in both columns
        replaceCheckboxes(capture);

        html2canvas(capture, {
            backgroundColor: '#f4f6f9',
            scale: 2,
            useCORS: true,
            logging: false,
            width: capture.offsetWidth,
            height: capture.offsetHeight
        }).then(function(canvas) {
            document.body.removeChild(capture);
            var link = document.createElement('a');
            link.download = myName.replace(/\s+/g,'_') + '_vs_' + oppName.replace(/\s+/g,'_') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            var btn = document.querySelector('.compare-header-controls button');
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
        }).catch(function(err) {
            document.body.removeChild(capture);
            console.error('Export failed:', err);
            alert('Export failed: ' + err.message);
            var btn = document.querySelector('.compare-header-controls button');
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
        });
    }

    function replaceCheckboxes(root) {
        var inputs = root.querySelectorAll('input[type=checkbox]');
        inputs.forEach(function(inp) {
            var div = document.createElement('div');
            div.style.cssText = 'width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;';
            var cls = inp.className || '';
            if (cls.indexOf('squad-checkbox') !== -1) {
                div.style.background = inp.checked ? '#000' : '#e0e0e0';
                if (!inp.checked) div.style.border = '2px solid #333';
            } else if (cls.indexOf('xi-checkbox') !== -1) {
                div.style.background = inp.checked ? '#667eea' : '#e0e0e0';
                if (!inp.checked) div.style.border = '2px solid #667eea';
            } else if (cls.indexOf('starting-checkbox') !== -1) {
                div.style.background = inp.checked ? '#dc3545' : '#e0e0e0';
                if (!inp.checked) div.style.border = '2px solid #dc3545';
            } else {
                div.style.background = inp.checked ? '#000' : '#e0e0e0';
                if (!inp.checked) div.style.border = '2px solid #333';
            }
            if (inp.checked) {
                div.style.display = 'inline-flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.innerHTML = '<span style="color:white;font-size:13px;line-height:1;">✓</span>';
            }
            inp.parentNode.replaceChild(div, inp);
        });
    }
})();
</script>
</body>
</html>
