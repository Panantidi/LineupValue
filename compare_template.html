<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match: {{my_name}} vs {{opponent_name}}</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: auto; overflow: visible; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    overflow: visible;
}
.compare-header {
    position: relative;
    background: linear-gradient(to right, #043fb6 0%, #2e7af8 100%);
    padding: 10px 20px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.compare-header h2 { font-size: 20px; margin: 0; }
.compare-header .stadium { font-size: 14px; opacity: 0.85; margin-top: 6px; text-align: center; }
.compare-header .stadium.neutral { color: #ffc107; font-weight: 700; opacity: 1; }
.compare-header-controls {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
}
.compare-header-left {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
}
.compare-header-left a,
.compare-header-left button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    color: white;
    text-decoration: none;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.compare-header-left a:hover,
.compare-header-left button:hover {
    background: rgba(255,255,255,0.3);
}
.compare-header-controls a,
.compare-header-controls button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
}
.compare-header-controls button {
    color: white;
    font-size: 13px;
}
.compare-wrapper {
    display: flex;
    overflow-x: auto;
    overflow-y: visible;
}
.compare-container {
    display: flex;
    flex: 1 0 auto;
    gap: 12px;
    min-width: max-content;
    align-items: flex-start;
}
.team-frame {
    flex: 0 0 auto;
    min-width: 1240px;
    width: 1240px;
    border: none;
    display: block;
    height: auto;
    overflow: visible;
    overflow-y: hidden;
}
.team-divider {
    width: 2px;
    background: linear-gradient(180deg, #043fb6, #2e7af8);
    flex-shrink: 0;
    align-self: stretch;
}

        .nav-rail {
            position: fixed;
            left: 0;
            top: 130px;
            width: 6px;
            height: 277px;
            background: #043fb6;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .nav-rail:hover {
            background: #2e7af8;
        }
        .nav-rail::after {
            content: "›";
            color: white;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
        }
        .team-nav-sidebar.collapsed .nav-rail::after {
            content: "‹";
        }
        .nav-rail.expanded {
            background: #2e7af8;
        }
        .team-nav-sidebar {
            position: fixed;
            left: 6px;
            top: 130px;
            width: 255px;
            background: white;
            border-radius: 0 8px 8px 0;
            padding: 14px 14px 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: transform 0.2s ease, opacity 0.2s ease;
            transform: translateX(0);
            opacity: 1;
        }
        .team-nav-sidebar.collapsed {
            transform: translateX(-100%);
            opacity: 0;
        }
        .nav-rail-btn {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            border: 1px solid #d0d0d0;
            background: #f5f5f5;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .nav-rail-btn:hover {
            background: #e0e0e0;
            color: #043fb6;
            border-color: #043fb6;
        }

        .team-nav-sidebar .nav-title {
            position: relative;
            height: 24px;
            font-weight: 700;
            color: #043fb6;
            font-size: 13px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
        }
        .team-nav-sidebar label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .team-nav-sidebar select {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            background: white;
            color: #333;
            cursor: pointer;
        }
        .team-nav-sidebar select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .team-nav-sidebar .form-group {
            margin-bottom: 12px;
        }
        .team-nav-sidebar button {
            width: 100%;
            background: #043fb6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .team-nav-sidebar button:hover {
            background: #2e7af8;
        }

</style>
</head>
<body>
<div class="nav-rail" id="nav-rail" onclick="toggleNavSidebar()" title="Show navigation"></div>
<aside class="team-nav-sidebar" id="team-nav-sidebar">
    <div class="nav-title"><button class="nav-rail-btn" onclick="toggleNavSidebar()" title="Hide">&lt;&lt; Hide</button></div>
    <div class="form-group">
        <label for="nav-country">Country</label>
        <select id="nav-country" onchange="onNavCountryChange()">
            <option value="">-- Select Country --</option>
        </select>
    </div>
    <div class="form-group">
        <label for="nav-championship">Championship</label>
        <select id="nav-championship" onchange="onNavChampionshipChange()" disabled>
            <option value="">-- Select Championship --</option>
        </select>
    </div>
    <div class="form-group">
        <label for="nav-team">Team</label>
        <select id="nav-team" onchange="onNavTeamChange()" disabled>
            <option value="">-- Select Team --</option>
        </select>
    </div>
    <div id="nav-match-group" style="display:none;">
        <div class="form-group">
            <label for="nav-match">Match</label>
            <select id="nav-match" onchange="onNavMatchChange()" disabled>
                <option value="">-- Select Match --</option>
            </select>
        </div>
    </div>
    <div id="nav-actions" style="display:none;">
        <button onclick="openNavTeamAnalysis()">Team Analysis</button>
    </div>
</aside>


<div class="compare-header">
    <!-- Left utility buttons: My Favorites + Screenshot (mirrors Team mode) -->
    <div class="compare-header-left">
        <a href="/lineup_ai/favorites" class="header-action-btn"><span>💎</span> My Favorites</a>
        <button type="button" class="header-action-btn" onclick="exportMatchScreenshot()" id="btn-match-screenshot">📸 Screenshot</button>
    </div>
    <h2 style="display:flex;align-items:center;justify-content:center;gap:12px;">
        <button onclick="updateTeamData('my')" title="Update Home Team" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:4px 8px;cursor:pointer;color:white;font-size:14px;">&#128260; Home</button>
        <span>{{my_name}} vs {{opponent_name}}</span>
        <button onclick="updateTeamData('opp')" title="Update Away Team" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:4px 8px;cursor:pointer;color:white;font-size:14px;">&#128260; Away</button>
    </h2>
    <span id="match-id" data-mid="{{mid}}" style="display:none"></span>
    <div class="stadium {{stadium_class}}">{{stadium_text}}{{neutral_suffix}}</div>
    <div class="compare-header-controls">
        <button id="match-btn-add-lineups" onclick="toggleBothFrames('bulk-lineup-panel-host', this)" title="Add Lineups (both teams)">👥 Add Lineups</button>
        <button id="match-btn-compare-lineups" onclick="toggleBothFrames('comparison-table-host', this)" title="Compare Lineups (both teams)">⚖️ Compare Lineups</button>
        <button id="match-btn-squad-overview" onclick="toggleBothFrames('info-bar-squad-host', this)" title="Squad Overview (both teams)">📊 Squad Overview</button>
        <button id="match-save-btn" onclick="saveMatchData()" title="Save Match Data">💾 Save</button>
        <a href="/lineup_ai/select">&#8592; Back to teams</a>
    </div>
</div>
<div class="compare-wrapper" id="scroll-wrapper">
<div class="compare-container" id="frames-container">
    <iframe id="my-frame" class="team-frame" src="/lineup_ai/{{my_team_id}}?embed=1&v=2" title="{{my_name}}" scrolling="no"></iframe>
    <iframe id="opp-frame" class="team-frame" src="/lineup_ai/{{opp_team_id}}?embed=1&v=2" title="{{opponent_name}}" scrolling="no"></iframe>
</div>
</div>

<script>
(function() {
    var myFrame = document.getElementById('my-frame');
    var oppFrame = document.getElementById('opp-frame');

    function hideHeaderElements(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            // Hide the entire inner header (Team mode buttons are exposed in compare header instead)
            var innerHeader = doc.querySelector('.header');
            if (innerHeader) innerHeader.style.display = 'none';
            // In Match mode, wrap bulk-lineup-panel-host + comparison-table-host in a
            // single flex-row container so they sit side by side (700 + 9 + 255 = 964px,
            // matching the main table width).
            var pageMain = doc.querySelector('.page-main');
            var bulkHost = doc.getElementById('bulk-lineup-panel-host');
            var compareHost = doc.getElementById('comparison-table-host');
            if (pageMain && bulkHost && compareHost && !doc.getElementById('bl-compare-row')) {
                var row = doc.createElement('div');
                row.id = 'bl-compare-row';
                row.style.cssText = 'display:flex;gap:9px;align-items:flex-start;margin-bottom:12px;width:964px;max-width:100%;box-sizing:border-box;';
                // Move both hosts INTO the new row, preserving order (bulk first, then compare)
                pageMain.insertBefore(row, bulkHost);
                row.appendChild(bulkHost);
                row.appendChild(compareHost);
            }
            var links = doc.querySelectorAll('a[href="/lineup_ai/select"]');
            links.forEach(function(el) { el.style.display = 'none'; });
            var btn = doc.getElementById('btn-export');
            if (btn) {
                var parent = btn.closest('div[style*="position:relative"]') || btn.closest('div') || btn.parentElement;
                if (parent && parent !== doc.body) parent.style.display = 'none';
                else btn.style.display = 'none';
            }
            var all = doc.querySelectorAll("button, a, div, span, form, aside");
            all.forEach(function(el) {
                var txt = (el.textContent || '').trim();
                var cls = (el.className || '').toString();
                var id = (el.id || '').toString();
                var isLeaf = el.children.length === 0;
                if (el.tagName === 'BUTTON' && (txt.includes('Save') || txt.includes('Сохранить'))) {
                    el.style.display = 'none';
                }
                if (cls.includes('my-squads') || cls.includes('save-panel') || cls.includes('save-block') ||
                    id.includes('save') || id.includes('my-squads') || id.includes('squad-save')) {
                    el.style.display = 'none';
                }
                if (isLeaf && (txt === 'My Squads' || txt === 'Мои составы' || txt.includes('My Squads'))) {
                    el.style.display = 'none';
                }
            });
            var saveForms = doc.querySelectorAll('form[action*="save"]');
            var cacheBadge = doc.querySelector(".cache-badge"); if (cacheBadge) cacheBadge.style.display = "none";
            saveForms.forEach(function(f) { f.style.display = 'none'; });
        } catch(e) {}
    }

    function resizeFrame(frame) {
        try {
            var doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc) return;
            var height = doc.documentElement.scrollHeight || doc.body.scrollHeight || 800;
            frame.style.height = height + 'px';
        } catch(e) {}
    }

    var framesLoaded = 0;
    function checkFramesLoaded() {
        framesLoaded++;
        if (framesLoaded === 2) {
            setTimeout(window.loadMatchData, 500);
        }
    }
    
    myFrame.onload = function() {
        hideHeaderElements(myFrame);
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
        checkFramesLoaded();
    };
    oppFrame.onload = function() {
        hideHeaderElements(oppFrame);
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
        checkFramesLoaded();
    };


    // Match Save functionality
    var matchSavedAt = null;

    // Toggle the same host in BOTH team iframes (Match mode) at once.
    // Used by 👥 / ⚖️ / 📊 buttons in the compare header.
    // 🧹 Build Lineup is intentionally NOT exposed here.
    window.toggleBothFrames = function(hostId, btn) {
        var myFrame = document.getElementById('my-frame');
        var oppFrame = document.getElementById('opp-frame');
        if (!myFrame || !oppFrame || !myFrame.contentWindow || !oppFrame.contentWindow) {
            alert('Frames not ready');
            return;
        }
        [myFrame, oppFrame].forEach(function(frame) {
            try {
                var win = frame.contentWindow;
                if (typeof win.toggleSection === 'function') {
                    win.toggleSection(hostId, null);
                }
            } catch (e) { /* cross-origin or frame not ready */ }
        });
        if (btn) {
            btn.classList.toggle('active');
        }
        // Resize BOTH iframes to match the new content height (otherwise
        // the iframe stays at its old height and the new panel gets cut off).
        setTimeout(function() {
            resizeFrame(myFrame);
            resizeFrame(oppFrame);
        }, 50);
    };

    window.saveMatchData = async function() {
        const mid = document.getElementById("match-id").dataset.mid;
        const btn = document.getElementById("match-save-btn");
        const myFrame = document.getElementById("my-frame");
        const oppFrame = document.getElementById("opp-frame");
        
        if (!myFrame.contentWindow || !oppFrame.contentWindow) {
            alert("Frames not ready");
            return;
        }
        
        btn.disabled = true;
        btn.textContent = "Saving...";
        
        try {
            const myData = myFrame.contentWindow.getCurrentTeamData ? myFrame.contentWindow.getCurrentTeamData() : null;
            const oppData = oppFrame.contentWindow.getCurrentTeamData ? oppFrame.contentWindow.getCurrentTeamData() : null;
            
            const payload = {
                home_data: myData,
                away_data: oppData,
                saved_at: new Date().toISOString()
            };
            
            const resp = await fetch("/lineup_ai/match_save/" + mid, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });
            const result = await resp.json();
            
            if (result.ok) {
                matchSavedAt = result.saved_at;
                btn.textContent = "Saved";
                setTimeout(() => { btn.textContent = "Save"; }, 2000);
            } else {
                throw new Error("Save failed");
            }
        } catch (e) {
            console.error("Save error:", e);
            btn.textContent = "Error";
            setTimeout(() => { btn.textContent = "Save"; }, 2000);
        }
        btn.disabled = false;
    }
    
    window.loadMatchData = async function() {
        const mid = document.getElementById("match-id").dataset.mid;
        if (!mid) return;
        
        try {
            const resp = await fetch("/lineup_ai/match_save/" + mid);
            const result = await resp.json();
            
            if (result.ok && result.home_data) {
                const myFrame = document.getElementById("my-frame");
                if (myFrame.contentWindow && myFrame.contentWindow.applySavedState) {
                    myFrame.contentWindow.applySavedState(result.home_data);
                }
            }
            if (result.ok && result.away_data) {
                const oppFrame = document.getElementById("opp-frame");
                if (oppFrame.contentWindow && oppFrame.contentWindow.applySavedState) {
                    oppFrame.contentWindow.applySavedState(result.away_data);
                }
            }
            matchSavedAt = result.saved_at;
            // Resize both iframes after applying saved state (panels may have been shown)
            setTimeout(function() {
                resizeFrame(myFrame);
                resizeFrame(oppFrame);
            }, 50);
        } catch (e) {
            console.error("Load error:", e);
        }
    }
    

    myFrame.addEventListener("load", function() {
        hideHeaderElements(myFrame);
        resizeFrame(myFrame);
        resizeFrame(oppFrame);
    });

    window.exportMatchScreenshot = async function() {
        var btn = document.querySelector('.compare-header-controls button');
        if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; }
        try {
            // Render each team via html2canvas INSIDE its own iframe (all styles intact)
            var myCanvas = await myFrame.contentWindow.getScreenshotCanvas();
            var oppCanvas = await oppFrame.contentWindow.getScreenshotCanvas();

            if (!myCanvas || !oppCanvas) {
                alert('Screenshot failed: could not capture one of the teams');
                return;
            }

            // Combine two canvases side by side
            var padding = 20;
            var gap = 20;
            var totalW = myCanvas.width + oppCanvas.width + gap + padding * 2;
            var maxH = Math.max(myCanvas.height, oppCanvas.height);
            var totalH = maxH + padding * 2;

            var combined = document.createElement('canvas');
            combined.width = totalW;
            combined.height = totalH;
            var ctx = combined.getContext('2d');

            // Fill background
            ctx.fillStyle = '#f4f6f9';
            ctx.fillRect(0, 0, totalW, totalH);

            // Draw left team
            ctx.drawImage(myCanvas, padding, padding);
            // Draw right team
            ctx.drawImage(oppCanvas, padding + myCanvas.width + gap, padding);

            // Get team names for filename
            var myDoc = myFrame.contentDocument || myFrame.contentWindow.document;
            var oppDoc = oppFrame.contentDocument || oppFrame.contentWindow.document;
            // Team name lives in .main-table h1 (the gradient bar)
            var myName = ((myDoc.querySelector('.main-table h1') || {}).textContent || 'Home').trim();
            var oppName = ((oppDoc.querySelector('.main-table h1') || {}).textContent || 'Away').trim();

            var link = document.createElement('a');
            link.download = myName.replace(/\s+/g, '_') + '_vs_' + oppName.replace(/\s+/g, '_') + '.png';
            link.href = combined.toDataURL('image/png');
            link.click();
        } catch(e) {
            alert('Screenshot failed: ' + e.message);
        } finally {
            if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
        }
    };
    
    // Update team data functionality
    window.updateTeamData = async function(teamType) {
        const frame = teamType === 'my' ? myFrame : oppFrame;
        const teamId = frame.src.match(/\/lineup_ai\/([^?]+)/)[1];
        
        const btn = document.querySelector(`button[onclick="updateTeamData('${teamType}')"]`);
        if (!btn || btn.disabled) return;
        
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = '⏳ ' + (teamType === 'my' ? 'Home' : 'Away');
        
        let seconds = 0;
        const counterInterval = setInterval(() => {
            seconds++;
            btn.textContent = '🔄 ' + seconds + 's';
        }, 1000);
        
        const startTime = Date.now();
        
        try {
            const r = await fetch('/lineup_ai/api/fetch/' + teamId + '?_t=' + Date.now(), { cache: 'no-store' });
            clearInterval(counterInterval);
            
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            
            const duration = ((Date.now() - startTime) / 1000).toFixed(1);
            btn.textContent = '✅ ' + duration + 's';
            
            // Reload frame
            frame.src = frame.src.replace(/[?&]v=[^&]*/, '') + '&v=' + Date.now();
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 2000);
        } catch (e) {
            clearInterval(counterInterval);
            console.error('[UpdateTeamData] error:', e);
            btn.textContent = '❌ Error';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 2000);
        }
    };
})();
</script>

<script>
(function() {
    var CURRENT_TEAM_ID = "{{my_team_id}}";
    var navData = null;
    var navFixtures = null;

    window.toggleNavSidebar = function() {
        var sb = document.getElementById('team-nav-sidebar');
        var rail = document.getElementById('nav-rail');
        var isCollapsed = sb.classList.toggle('collapsed');
        if (isCollapsed) {
            rail.title = 'Show navigation';
            rail.classList.remove('expanded');
        } else {
            rail.title = 'Hide navigation';
            rail.classList.add('expanded');
        }
    };

    async function loadNavData() {
        try {
            var response = await fetch('/lineup_ai/data.json');
            navData = await response.json();
            populateNavCountries();
        } catch (error) {
            console.error('Error loading lineup data:', error);
        }
    }

    function populateNavCountries() {
        var countrySelect = document.getElementById('nav-country');
        var countries = Object.keys(navData).sort();
        countries.forEach(function(country) {
            var option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            countrySelect.appendChild(option);
        });
        // Auto-select current country based on team_id
        for (var country in navData) {
            for (var champ in navData[country]) {
                if (navData[country][champ].some(function(t) { return t.id === CURRENT_TEAM_ID; })) {
                    countrySelect.value = country;
                    onNavCountryChange();
                    return;
                }
            }
        }
    }

    window.onNavCountryChange = function() {
        var country = document.getElementById('nav-country').value;
        var championshipSelect = document.getElementById('nav-championship');
        var teamSelect = document.getElementById('nav-team');
        var matchSelect = document.getElementById('nav-match');
        var matchGroup = document.getElementById('nav-match-group');
        var matchActions = document.getElementById('nav-actions');

        championshipSelect.innerHTML = '<option value="">-- Select Championship --</option>';
        teamSelect.innerHTML = '<option value="">-- Select Team --</option>';
        matchSelect.innerHTML = '<option value="">-- Select Match --</option>';
        teamSelect.disabled = true;
        if (matchGroup) matchGroup.style.display = 'none';
        if (matchActions) matchActions.style.display = 'none';

        if (!country || !navData[country]) {
            championshipSelect.disabled = true;
            return;
        }

        var championships = Object.keys(navData[country]).sort();
        var currentChamp = null;
        for (var ch in navData[country]) {
            if (navData[country][ch].some(function(t) { return t.id === CURRENT_TEAM_ID; })) {
                currentChamp = ch;
            }
        }
        championships.forEach(function(championship) {
            var option = document.createElement('option');
            option.value = championship;
            option.textContent = championship;
            if (championship === currentChamp) option.selected = true;
            championshipSelect.appendChild(option);
        });
        championshipSelect.disabled = false;
        onNavChampionshipChange();
    };

    window.onNavChampionshipChange = function() {
        var country = document.getElementById('nav-country').value;
        var championship = document.getElementById('nav-championship').value;
        var teamSelect = document.getElementById('nav-team');
        var matchSelect = document.getElementById('nav-match');
        var matchGroup = document.getElementById('nav-match-group');
        var matchActions = document.getElementById('nav-actions');

        teamSelect.innerHTML = '<option value="">-- Select Team --</option>';
        matchSelect.innerHTML = '<option value="">-- Select Match --</option>';
        if (matchGroup) matchGroup.style.display = 'none';
        if (matchActions) matchActions.style.display = 'none';

        if (!country || !championship || !navData[country][championship]) {
            teamSelect.disabled = true;
            return;
        }

        var teams = navData[country][championship];
        teams.forEach(function(team) {
            var option = document.createElement('option');
            option.value = team.id;
            option.textContent = team.name;
            if (team.id === CURRENT_TEAM_ID) option.selected = true;
            teamSelect.appendChild(option);
        });
        teamSelect.disabled = false;
    };

    window.onNavTeamChange = async function() {
        var teamSelect = document.getElementById('nav-team');
        var teamId = teamSelect.value;
        var matchSelect = document.getElementById('nav-match');
        var matchGroup = document.getElementById('nav-match-group');
        var matchActions = document.getElementById('nav-actions');

        if (!teamId) {
            if (matchGroup) matchGroup.style.display = 'none';
            if (matchActions) matchActions.style.display = 'none';
            return;
        }

        if (matchGroup) matchGroup.style.display = 'block';
        if (matchActions) matchActions.style.display = 'block';

        matchSelect.innerHTML = '<option value="">Loading fixtures...</option>';
        matchSelect.disabled = true;

        try {
            var resp = await fetch('/lineup_ai/api/fixtures/' + teamId);
            var data = await resp.json();
            navFixtures = data.fixtures || [];

            matchSelect.innerHTML = '<option value="">-- Select a match --</option>';
            navFixtures.forEach(function(f, i) {
                var opt = document.createElement('option');
                opt.value = i;
                opt.textContent = f.date + '  ' + f.home + ' - ' + f.away;
                matchSelect.appendChild(opt);
            });
            matchSelect.disabled = false;
        } catch (e) {
            console.error('Failed to load fixtures:', e);
            matchSelect.innerHTML = '<option value="">Failed to load</option>';
        }
    };

    window.onNavMatchChange = function() {
        var teamId = document.getElementById('nav-team').value;
        var idx = document.getElementById('nav-match').value;
        if (!teamId || idx === '' || !navFixtures) return;

        var fixture = navFixtures[parseInt(idx)];
        if (fixture) {
            var homeId = fixture.home_id || '';
            var awayId = fixture.away_id || '';
            var homeNm = fixture.home || '';
            var awayNm = fixture.away || '';
            var params = new URLSearchParams({
                mid: fixture.mid,
                home_id: homeId,
                away_id: awayId,
                home_name: homeNm,
                away_name: awayNm
            });
            window.location.href = '/lineup_ai/compare/' + teamId + '?' + params.toString();
        }
    };

    window.openNavTeamAnalysis = function() {
        var teamId = document.getElementById('nav-team').value;
        if (teamId) window.location.href = '/lineup_ai/' + teamId;
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNavData);
    } else {
        loadNavData();
    }
})();
</script>

</body>
</html>
