<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match: {{home_name}} vs {{away_name}}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; overflow-x: auto; }
.compare-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 12px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    white-space: nowrap;
}
.compare-header h2 { font-size: 22px; margin: 0; }
.compare-header a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; }
.compare-header a:hover { text-decoration: underline; }
.compare-container {
    display: flex;
    gap: 0;
    min-width: max-content;
    overflow-x: auto;
    height: calc(100vh - 52px);
}
.team-frame {
    flex: 0 0 auto;
    width: 50vw;
    min-width: 700px;
    border: none;
}
.team-divider {
    width: 2px;
    background: linear-gradient(180deg, #667eea, #764ba2);
    flex-shrink: 0;
}
@media (max-width: 1440px) {
    .team-frame { min-width: 600px; }
}
</style>
</head>
<body>
<div class="compare-header">
    <h2>{{home_name}} vs {{away_name}}</h2>
    <a href="/lineup_ai/select">← Back to team selection</a>
</div>
<div class="compare-container">
    <iframe class="team-frame" src="/lineup_ai/{{home_team_id}}" title="{{home_name}}"></iframe>
    <div class="team-divider"></div>
    <iframe class="team-frame" src="/lineup_ai/{{away_team_id}}" title="{{away_name}}"></iframe>
</div>
</body>
</html>
